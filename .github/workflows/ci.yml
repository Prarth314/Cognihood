name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Check Edge Functions
        run: npm exec --yes --package=deno@2.5.6 -- deno check --node-modules-dir=none supabase/functions/gemini-assist/index.ts supabase/functions/delete-account/index.ts
      - name: Verify isolated SQL authorization and migrations
        run: npm exec --yes --package=deno@2.5.6 -- deno run --node-modules-dir=none --allow-read --allow-env scripts/check-migrations.mts
      - run: npm run build
      - run: npm audit
      - name: Audit isolated Pi dependencies without compiling native GPIO
        run: npm ci --ignore-scripts --prefix hardware/raspberry-pi && npm audit --prefix hardware/raspberry-pi
