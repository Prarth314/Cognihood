name: Performance sampling
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: performance-${{ github.ref }}
  cancel-in-progress: true
jobs:
  synthetic-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          cache: npm
      - name: Record virtual runner environment (no host identifiers)
        run: node -e "const os=require('node:os'); console.log(JSON.stringify({os:os.type(),release:os.release(),arch:os.arch(),cpu:os.cpus()[0]?.model,logicalProcessors:os.cpus().length,virtualRunnerMemoryBytes:os.totalmem(),node:process.version}));"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build:test
      - name: Observe synthetic worker for two minutes
        run: npx playwright test tests/browser/performance.spec.ts
        env:
          COGNI_PERFORMANCE: 'true'
